<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Analyzer</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div class="container">
    <h1>Password Strength Analyzer</h1>
    <p class="subtitle">Check your password strength and breach status</p>

    <div class="input-wrap">
      <input type="password" id="password-input" placeholder="Type a password..." autocomplete="off"/>
      <button id="toggle-btn" onclick="toggleVisibility()">Show</button>
    </div>

    <div class="score-wrap">
      <div class="score-bar-bg">
        <div class="score-bar" id="score-bar"></div>
      </div>
      <span class="score-label" id="score-label">—</span>
    </div>

    <div class="results" id="results" style="display:none">
      <div class="result-item">
        <span class="result-label">Crack Time</span>
        <span class="result-val" id="crack-time">—</span>
      </div>
      <div class="result-item" id="breach-row">
        <span class="result-label">Breach Status</span>
        <span class="result-val" id="breach-msg">—</span>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <script>
    const labels = ["Very Weak", "Weak", "Fair", "Strong", "Very Strong"];
    const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#16a34a"];
    let visible = false;
    let timer;

    document.getElementById("password-input").addEventListener("input", (e) => {
      clearTimeout(timer);
      const val = e.target.value;
      if (!val) { reset(); return; }
      timer = setTimeout(() => analyze(val), 400);
    });

    function toggleVisibility() {
      const input = document.getElementById("password-input");
      const btn = document.getElementById("toggle-btn");
      visible = !visible;
      input.type = visible ? "text" : "password";
      btn.textContent = visible ? "Hide" : "Show";
    }

    async function analyze(password) {
      const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      // Score bar
      const pct = (data.score / 4) * 100;
      const bar = document.getElementById("score-bar");
      bar.style.width = pct + "%";
      bar.style.background = colors[data.score];
      document.getElementById("score-label").textContent = labels[data.score];
      document.getElementById("score-label").style.color = colors[data.score];

      // Crack time
      document.getElementById("crack-time").textContent = data.crack_time;

      // Breach
      const breachMsg = document.getElementById("breach-msg");
      if (data.breached) {
        breachMsg.textContent = `⚠ Found in ${data.breach_count.toLocaleString()} breaches!`;
        breachMsg.style.color = "#ef4444";
      } else {
        breachMsg.textContent = "✓ Not found in any breach";
        breachMsg.style.color = "#22c55e";
      }

      // Feedback
      const fb = document.getElementById("feedback");
      if (data.warning || data.feedback.length > 0) {
        const items = data.warning ? [data.warning, ...data.feedback] : data.feedback;
        fb.innerHTML = items.map(f => `<div class="fb-item">💡 ${f}</div>`).join("");
      } else {
        fb.innerHTML = "";
      }

      document.getElementById("results").style.display = "block";
    }

    function reset() {
      document.getElementById("score-bar").style.width = "0%";
      document.getElementById("score-label").textContent = "—";
      document.getElementById("results").style.display = "none";
    }
  </script>
</body>
</html>
